# Generated by listing-sync (infra scripts/listing_sync/connectors); edits are overwritten.
# Runs the action from this repo against the live API on every push, without a key (the anonymous tier).
name: smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch the samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/samples"
          curl -sS --fail-with-body -o "$RUNNER_TEMP/samples/beispiel-xrechnung.xml" https://invowerk.dev/app-static/demo/beispiel-xrechnung.xml
      - name: get_me
        id: get_me
        uses: ./
        with:
          operation: get_me
      - name: parse_invoice
        id: parse_invoice
        uses: ./
        with:
          operation: parse_invoice
          file: ${{ runner.temp }}/samples/beispiel-xrechnung.xml
      - name: generate_invoice
        id: generate_invoice
        uses: ./
        with:
          operation: generate_invoice
          json: |
            {
              "buyer": {
                "address": {
                  "city": "Munich",
                  "country_code": "DE",
                  "post_code": "80331"
                },
                "electronic_address": "buyer@example.com",
                "name": "Buyer AG"
              },
              "buyer_reference": "04011000-1234512345-06",
              "currency": "EUR",
              "due_date": "2026-02-15",
              "flavor": "xrechnung",
              "invoice_number": "INV-001",
              "issue_date": "2026-01-15",
              "lines": [
                {
                  "line_net_amount": "100.00",
                  "name": "Widget",
                  "net_price": "100.00",
                  "quantity": "1",
                  "tax_category": "S",
                  "tax_rate": "19.00"
                }
              ],
              "payment_iban": "DE75512108001245126199",
              "seller": {
                "address": {
                  "city": "Berlin",
                  "country_code": "DE",
                  "post_code": "10115"
                },
                "contact_email": "accounts@example.com",
                "contact_name": "Accounts",
                "contact_phone": "+49 30 1234567",
                "electronic_address": "seller@example.com",
                "name": "Seller GmbH",
                "vat_id": "DE123456789"
              },
              "syntax": "ubl",
              "tax_breakdown": [
                {
                  "category": "S",
                  "rate": "19.00",
                  "tax_amount": "19.00",
                  "taxable_amount": "100.00"
                }
              ],
              "totals": {
                "line_total": "100.00",
                "tax_exclusive": "100.00",
                "tax_inclusive": "119.00"
              }
            }
      - name: render_invoice
        id: render_invoice
        uses: ./
        with:
          operation: render_invoice
          file: ${{ runner.temp }}/samples/beispiel-xrechnung.xml
      - name: validate_invoice
        id: validate_invoice
        uses: ./
        with:
          operation: validate_invoice
          file: ${{ runner.temp }}/samples/beispiel-xrechnung.xml
          fail-if: '.valid == false'
      - name: Check every answer was written
        shell: bash
        env:
          OUT_0: ${{ steps.get_me.outputs.output }}
          OUT_1: ${{ steps.parse_invoice.outputs.output }}
          OUT_2: ${{ steps.generate_invoice.outputs.output }}
          OUT_3: ${{ steps.render_invoice.outputs.output }}
          OUT_4: ${{ steps.validate_invoice.outputs.output }}
        run: |
          set -euo pipefail
          for out in "$OUT_0" "$OUT_1" "$OUT_2" "$OUT_3" "$OUT_4"; do
            test -s "$out" || { echo "::error::empty answer: $out"; exit 1; }
          done
