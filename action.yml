# Generated by listing-sync (infra scripts/listing_sync/connectors); edits are overwritten.
name: "invowerk API"
description: "Validate XRechnung, ZUGFeRD, Factur-X and Peppol BIS e-invoices in a workflow and fail the job when one is invalid."
branding:
  icon: "check-circle"
  color: "green"
inputs:
  operation:
    description: "The API operation to call: get_me, parse_invoice, convert_invoice, generate_invoice, explain_codes, render_invoice, validate_invoice."
    required: true
  file:
    description: "Path of the file to upload, for operations that take one."
    required: false
    default: ""
  json:
    description: "The request body as a JSON object, for operations that take one."
    required: false
    default: ""
  query:
    description: "Path, query and form parameters, one key=value per line; repeat a key for a list."
    required: false
    default: ""
  api-key:
    description: "Your invowerk API key, from a secret. Optional: without one the anonymous tier's lower limits apply; a key raises them. Create one at https://invowerk.dev/go/gh-action?to=/app/api-keys"
    required: false
    default: ""
  output:
    description: "Where to write the answer (default: a file in the runner's temp directory, named after the operation)."
    required: false
    default: ""
  fail-if:
    description: "A jq expression on a JSON answer; the step fails when it is true (e.g. `.valid == false`)."
    required: false
    default: ""
  base-url:
    description: "The API base URL."
    required: false
    default: "https://api.invowerk.dev"
outputs:
  status:
    description: "The HTTP status of the last API call."
    value: ${{ steps.call.outputs.status }}
  output:
    description: "The path of the file holding the answer."
    value: ${{ steps.call.outputs.output }}
runs:
  using: composite
  steps:
    - id: call
      shell: bash
      env:
        INPUT_OPERATION: ${{ inputs.operation }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_JSON: ${{ inputs.json }}
        INPUT_QUERY: ${{ inputs.query }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FAIL_IF: ${{ inputs.fail-if }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
      run: |
        set -euo pipefail

        die() {
          echo "::error title=invowerk API::$*"
          exit 1
        }

        # has WORD "LIST": WORD is one of the space-separated LIST.
        has() {
          case " $2 " in *" $1 "*) return 0 ;; esac
          return 1
        }

        urlencode() {
          jq -rn --arg v "$1" '$v | @uri'
        }

        # meta OPERATION: set the operation's request shape (generated from the API).
        meta() {
          case "$1" in
            get_me)
              method='GET'
              route='/v1/me'
              body='none'
              path_fields=''
              query_fields=''
              form_fields=''
              file_field=''
              file_required='0'
              json_required='0'
              accepts=''
              poll_op=''
              result_op=''
              ;;
            parse_invoice)
              method='POST'
              route='/v1/parse'
              body='multipart'
              path_fields=''
              query_fields=''
              form_fields=''
              file_field='file'
              file_required='1'
              json_required='0'
              accepts=''
              poll_op=''
              result_op=''
              ;;
            convert_invoice)
              method='POST'
              route='/v1/convert'
              body='multipart'
              path_fields=''
              query_fields='target_syntax target_flavor format'
              form_fields=''
              file_field='file'
              file_required='1'
              json_required='0'
              accepts='target_syntax target_flavor format'
              poll_op=''
              result_op=''
              ;;
            generate_invoice)
              method='POST'
              route='/v1/generate'
              body='json'
              path_fields=''
              query_fields='format'
              form_fields=''
              file_field=''
              file_required='0'
              json_required='1'
              accepts='format'
              poll_op=''
              result_op=''
              ;;
            explain_codes)
              method='GET'
              route='/v1/explain'
              body='none'
              path_fields=''
              query_fields='code lang'
              form_fields=''
              file_field=''
              file_required='0'
              json_required='0'
              accepts='code lang'
              poll_op=''
              result_op=''
              ;;
            render_invoice)
              method='POST'
              route='/v1/render'
              body='multipart'
              path_fields=''
              query_fields='lang format'
              form_fields=''
              file_field='file'
              file_required='0'
              json_required='0'
              accepts='lang format'
              poll_op=''
              result_op=''
              ;;
            validate_invoice)
              method='POST'
              route='/v1/validate'
              body='multipart'
              path_fields=''
              query_fields='explain lang'
              form_fields=''
              file_field='file'
              file_required='1'
              json_required='0'
              accepts='explain lang'
              poll_op=''
              result_op=''
              ;;
            *) return 1 ;;
          esac
        }

        # param KEY: the first value given for KEY in the query input.
        param() {
          local i=0
          while [ "$i" -lt "${#keys[@]}" ]; do
            if [ "${keys[$i]}" = "$1" ]; then
              printf '%s' "${values[$i]}"
              return 0
            fi
            i=$((i + 1))
          done
          return 1
        }

        # request OPERATION [JOB_ID]: one API call. Sets status and ctype; the answer
        # is in $work/response. With JOB_ID, the job id fills the path and no body is
        # sent (a job's poll and result calls).
        request() {
          local op="$1" job="${2:-}" url field value key i written rc=0 upload
          local query=""
          local args=()
          meta "$op"
          url="$route"
          for field in $path_fields; do
            if [ -n "$job" ]; then
              value="$job"
            else
              value="$(param "$field")" || die "$op needs $field (query: $field=...)"
            fi
            url="${url//\{$field\}/$(urlencode "$value")}"
          done
          i=0
          while [ "$i" -lt "${#keys[@]}" ]; do
            key="${keys[$i]}"
            if has "$key" "$query_fields"; then
              query="${query}${query:+&}$(urlencode "$key")=$(urlencode "${values[$i]}")"
            elif [ -z "$job" ] && has "$key" "$form_fields"; then
              args+=(--form-string "$key=${values[$i]}")
            fi
            i=$((i + 1))
          done
          if [ -z "$job" ]; then
            case "$body" in
              multipart)
                if [ -n "$INPUT_FILE" ]; then
                  upload="${INPUT_FILE//\\/\\\\}"
                  upload="${upload//\"/\\\"}"
                  args+=(-F "$file_field=@\"$upload\"")
                fi
                ;;
              json)
                args+=(-H "Content-Type: application/json" --data-binary "@$work/body.json")
                ;;
            esac
          fi
          written="$(curl -sS --fail-with-body --retry 2 --connect-timeout 30 --max-time 900 \
            -A "invowerk-action/1.0.0" ${auth[@]+"${auth[@]}"} -X "$method" -o "$work/response" \
            -w '%{http_code} %{content_type}' ${args[@]+"${args[@]}"} \
            "$base$url${query:+?$query}")" || rc=$?
          status="${written%% *}"
          ctype="${written#* }"
          ctype="${ctype%%;*}"
          if [ "$rc" -ne 0 ]; then
            echo "status=${status:-000}" >>"$GITHUB_OUTPUT"
            if [ "${status:-000}" -ge 400 ]; then
              echo "::error title=invowerk API::$op answered HTTP $status"
              head -c 4000 "$work/response" 2>/dev/null || true
              echo
              exit 1
            fi
            die "$op: the request failed (curl exit $rc)"
          fi
        }

        command -v curl >/dev/null || die "curl is required on the runner"
        command -v jq >/dev/null || die "jq is required on the runner"
        case "$INPUT_API_KEY" in *$'\n'* | *$'\r'*) die "api-key must be a single line" ;; esac
        meta "$INPUT_OPERATION" || die "unknown operation '$INPUT_OPERATION': use one of get_me parse_invoice convert_invoice generate_invoice explain_codes render_invoice validate_invoice"
        has "$INPUT_OPERATION" "get_me parse_invoice convert_invoice generate_invoice explain_codes render_invoice validate_invoice" || die "unknown operation '$INPUT_OPERATION': use one of get_me parse_invoice convert_invoice generate_invoice explain_codes render_invoice validate_invoice"
        poll="$poll_op"
        result="$result_op"
        base="${INPUT_BASE_URL%/}"

        # mktemp -d makes a 0700 directory: the key file in it is private.
        work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/invowerk-action.XXXXXX")"
        trap 'rm -rf "$work"' EXIT
        # Without a key the call runs on the anonymous tier (lower limits).
        auth=()
        if [ -n "$INPUT_API_KEY" ]; then
          printf '%s: %s\n' "X-API-Key" "$INPUT_API_KEY" >"$work/auth"
          auth=(-H "@$work/auth")
        fi

        keys=()
        values=()
        while IFS= read -r line || [ -n "$line" ]; do
          line="${line%$'\r'}"
          line="${line#"${line%%[![:space:]]*}"}"
          [ -n "$line" ] || continue
          case "$line" in '#'*) continue ;; *=*) ;; *) die "query: '$line' is not key=value" ;; esac
          key="${line%%=*}"
          key="${key//[[:space:]]/}"
          has "$key" "$accepts" || die "$INPUT_OPERATION takes no parameter '$key' (it takes: ${accepts:-none})"
          keys+=("$key")
          values+=("${line#*=}")
        done <<<"$INPUT_QUERY"

        if [ -n "$INPUT_FILE" ]; then
          [ -n "$file_field" ] || die "$INPUT_OPERATION takes no file"
          [ -f "$INPUT_FILE" ] || die "file not found: $INPUT_FILE"
        elif [ "$file_required" = 1 ]; then
          die "$INPUT_OPERATION needs a file (input: file)"
        fi
        if [ -n "$INPUT_JSON" ]; then
          [ "$body" = json ] || die "$INPUT_OPERATION takes no JSON body"
          printf '%s' "$INPUT_JSON" >"$work/body.json"
          jq -e 'type == "object"' "$work/body.json" >/dev/null 2>&1 || die "json is not a JSON object"
        elif [ "$body" = json ]; then
          [ "$json_required" = 0 ] || die "$INPUT_OPERATION needs a JSON body (input: json)"
          printf '{}' >"$work/body.json"
        fi

        if [ -n "$poll" ]; then
          request "$INPUT_OPERATION"
          job="$(jq -r '.job_id // .id // empty' "$work/response")"
          [ -n "$job" ] || die "$INPUT_OPERATION answered without a job id"
          echo "$INPUT_OPERATION: job $job queued"
          deadline=$((SECONDS + 3600))
          while :; do
            request "$poll" "$job"
            state="$(jq -r '.status // empty' "$work/response")"
            case "$state" in
              queued | running) ;;
              succeeded) break ;;
              *) die "job $job ended '$state': $(jq -r '.error // "no error message"' "$work/response")" ;;
            esac
            [ "$SECONDS" -lt "$deadline" ] || die "job $job is still $state after 60 minutes"
            sleep 5
          done
          request "$result" "$job"
        else
          request "$INPUT_OPERATION"
        fi

        case "$ctype" in
          application/json | *+json) ext=json ;;
          application/pdf) ext=pdf ;;
          application/xml | text/xml | *+xml) ext=xml ;;
          text/html) ext=html ;;
          text/markdown) ext=md ;;
          text/*) ext=txt ;;
          *) ext=bin ;;
        esac
        out="${INPUT_OUTPUT:-${RUNNER_TEMP:-.}/invowerk-$INPUT_OPERATION.$ext}"
        mkdir -p "$(dirname "$out")"
        mv "$work/response" "$out"

        matched=0
        if [ -n "$INPUT_FAIL_IF" ]; then
          [ "$ext" = json ] || die "fail-if needs a JSON answer; $INPUT_OPERATION answered $ctype"
          rc=0
          jq -e "$INPUT_FAIL_IF" "$out" >/dev/null || rc=$?
          case "$rc" in
            0) matched=1 ;;
            1) ;;
            *) die "fail-if: jq could not evaluate '$INPUT_FAIL_IF' on the answer (jq exit $rc)" ;;
          esac
        fi

        {
          echo "status=$status"
          echo "output=$out"
        } >>"$GITHUB_OUTPUT"
        echo "$INPUT_OPERATION: HTTP $status, $ctype, $(wc -c <"$out" | tr -d ' ') bytes -> $out"
        if [ "$matched" = 1 ]; then
          echo "::error title=invowerk API::fail-if matched: $INPUT_FAIL_IF"
          jq . "$out" | head -c 20000 || true
          echo
          exit 1
        fi
